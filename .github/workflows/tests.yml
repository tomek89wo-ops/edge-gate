name: tests

# This repository had no CI at all until 2026-09-07 — twenty-eight tests that
# nothing ever ran. It was found by pointing ci-claim-gap
# (github.com/tomek89wo-ops/ci-claim-gap) at this repository, which returned
# `HTTP 404 listing workflows`: there was no `.github` directory to read.
#
# That is the exact shape both of these repositories exist to find — a
# mechanism that has to be REMEMBERED rather than enforced. The tests were
# green on the author's machine and only there, so nothing would have failed if
# a change broke them on another Python version or another operating system.
#
# The whole suite runs on every platform and every supported Python: no `-k`,
# no `-m`, no marker filters. A tool that reports opt-in coverage in other
# projects has no business shipping opt-in coverage of its own.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r requirements.txt

      # No filters of any kind. The whole suite, on every platform.
      - name: Run tests
        run: python -m pytest -q

  example-runs:
    # A statistical instrument that imports cleanly but produces nothing is
    # still broken. The tests cover the functions; this covers the claim on the
    # front of the README — that you can point it at data and get a verdict.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run every example end to end
        run: |
          set -e
          shopt -s nullglob
          found=0
          for f in examples/*.py; do
            echo "── $f"
            python "$f"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "No examples found — this step would pass silently forever." >&2
            exit 1
          fi
